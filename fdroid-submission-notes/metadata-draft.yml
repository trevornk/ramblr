# Corrected fdroiddata recipe for com.trevornk.ramblr
#
# Reference copy of what metadata/com.trevornk.ramblr.yml in fdroiddata should
# say. This file is documentation, not something F-Droid reads -- the live MR is
# fdroid/fdroiddata!42401.
#
# Rewritten after reviewer Miggi's physical-device review of 1.0.20/23. The
# previous draft here was badly stale (versionName 1.0.3, versionCode 6,
# `gradle: [yes]` from before the flavor split existed, and no AntiFeatures
# beyond NonFreeNet), which is part of why the live MR ended up building the
# wrong flavor.
#
# DO NOT push the Builds/Binaries section below until a signed
# Ramblr-<version>-storefront-release.apk is actually published on the GitHub
# release. See "Blocked on" at the bottom.

Categories:
  - Keyboard & IME
  - Writing
License: GPL-3.0-only
AuthorName: Trevor NK
SourceCode: https://github.com/trevornk/ramblr
IssueTracker: https://github.com/trevornk/ramblr/issues
Changelog: https://github.com/trevornk/ramblr/releases
AutoName: Ramblr

# --- AntiFeatures ---------------------------------------------------------
# NonFreeNet: optional cloud transcription/cleanup via a user-supplied API key,
# off by default. Already on the live MR.
#
# NonFreeAssets: KEPT (but no longer about a *default*). Since trevornk/ramblr#134
# (2026-08-26) the on-device cleanup default is the Apache-2.0 mumble-cleanup
# fine-tune; the non-free entries are now both optional, non-default alternatives:
# LFM2.5-350M (LFM Open License v1.0, whose §5 terminates commercial-use rights
# for legal entities at/above $10M annual revenue -- a field-of-endeavor
# restriction failing DFSG §6 / OSD §6, notwithstanding Liquid AI's "open"
# branding) and the Parakeet Unified 0.6B transcription upgrade (#197, NVIDIA
# Open Model License). Both are downloaded from upstream on request, never
# bundled in the APK.
#
# This is declared rather than hidden, and the app also (a) records every
# model's license in machine-readable form, (b) shows "not FOSS" in the model
# picker, and (c) requires explicit opt-in license consent before the download
# is even enqueued.
#
# The anti-feature cannot come off entirely while either optional non-free
# entry remains in the catalog; the #134 end state keeps them as consent-gated
# alternatives (LFM won the A/B's no-hallucination criterion; Parakeet Unified
# is the top-quality English ASR option), so this declaration stays.
#
# NOT declared: UpstreamNonFree. All transcription, streaming-preview, and VAD
# models -- everything the core dictation feature actually depends on -- are
# CC-BY-4.0 / CC-BY-SA-4.0 / MIT. The app is fully usable with no non-free
# component at all.
AntiFeatures:
  NonFreeNet:
    en-US: Optional cloud transcription/cleanup uses a user-supplied API key.
  NonFreeAssets:
    en-US: >-
      Optional non-default models (the LFM2.5-350M cleanup alternative and the
      Parakeet Unified 0.6B transcription upgrade) are published under licenses
      restricting commercial use. They are downloaded on request, never
      bundled, and require explicit consent. The default cleanup and
      transcription models and the app itself are free-licensed.

RepoType: git
Repo: https://github.com/trevornk/ramblr.git

# --- Binaries -------------------------------------------------------------
# CHANGED from Ramblr-%v-github-release.apk. The github flavor is the sideload
# channel and is the ONLY flavor that compiles the self-updater in
# (SelfUpdateCheckWorker polls api.github.com/repos/trevornk/ramblr/releases/
# latest roughly every 6h with notify defaulting on; SelfUpdateInstaller
# installs via PackageInstaller). An app that updates itself outside F-Droid
# does not belong in F-Droid, and the repo's own README designates storefront
# as the F-Droid/Play build.
Binaries: https://github.com/trevornk/ramblr/releases/download/v%v/Ramblr-%v-storefront-release.apk

Builds:
  - versionName: 1.0.23
    versionCode: 26
    commit: v1.0.23
    subdir: app
    submodules: true
    # CHANGED from [github]. Verified on a real assembleRelease that the
    # storefront APK contains zero SelfUpdateCheckWorker type descriptors and
    # neither REQUEST_INSTALL_PACKAGES nor UPDATE_PACKAGES_WITHOUT_USER_ACTION
    # (aapt2 dump permissions), while the github APK carries both.
    gradle:
      - storefront
    # sherpa-onnx and llama.cpp's gguf-hash deps are removed from the build
    # tree by F-Droid's scanner; both are source submodules, not prebuilts.
    scandelete:
      - sherpa-onnx
      - llama.cpp/examples/gguf-hash/deps

AllowedAPKSigningKeys: 375c6f118f18f900971e80ee1b9f711b7abd0845e6de317fbdff0abbfb1eda5a

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 1.0.23
CurrentVersionCode: 26

# --- Blocked on -----------------------------------------------------------
# 1. A signed Ramblr-<version>-storefront-release.apk published at the Binaries
#    URL above. reproducible-build.yml now uploads both flavors' release APKs
#    (commit d67869f) -- before that fix the storefront APK was built by
#    `assembleRelease` and then discarded, which is precisely why no storefront
#    reference binary has ever existed and why the recipe was pinned to github.
#    Flipping the flavor before the artifact exists would leave F-Droid's binary
#    comparison with nothing to compare against.
# 2. A version bump + tag, so versionName/versionCode/commit above point at a
#    build that actually contains the review fixes (segmented local decode for
#    the OOM, license consent gate, updated description).
