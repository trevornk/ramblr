name: Exact-source GitHub debug

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exact-source-github-debug-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact approved source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 0091ff46a86aec3622e0c71f15da83afd6228114
          submodules: recursive

      - name: Assert exact clean source and submodules
        run: |
          set -euo pipefail
          EXPECTED=0091ff46a86aec3622e0c71f15da83afd6228114
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          git diff --exit-code
          git diff --cached --exit-code
          git submodule status --recursive
          ! git submodule status --recursive | grep -E '^[+-U]'
          printf 'source_commit=%s\n' "$EXPECTED" > provenance.txt
          printf 'workflow_commit=%s\n' "$GITHUB_SHA" >> provenance.txt

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-provider: basic

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Run CI-equivalent JVM tests and build GitHub debug
        run: ./gradlew testGithubDebugUnitTest testStorefrontDebugUnitTest assembleGithubDebug

      - name: Verify candidate identity and collect test summary
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/github/debug/Ramblr-1.0.32-github-debug.apk
          test -f "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name aapt -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$AAPT" dump badging "$APK" | tee candidate-badging.txt
          grep -q "package: name='com.trevornk.ramblr' versionCode='35' versionName='1.0.32'" candidate-badging.txt
          grep -q '^application-debuggable$' candidate-badging.txt
          python3 - <<'PY' > unit-test-summary.txt
          # Reports were generated by the immediately preceding trusted Gradle task.
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for flavor in ("github", "storefront"):
              reports = sorted(Path("app/build/test-results").glob(f"test{flavor.title()}DebugUnitTest/*.xml"))
              assert reports, f"no {flavor} unit-test XML reports"
              totals = {key: 0 for key in ("tests", "failures", "errors", "skipped")}
              for report in reports:
                  root = ET.parse(report).getroot()
                  for key in totals:
                      totals[key] += int(root.attrib.get(key, 0))
              assert totals["failures"] == totals["errors"] == 0, (flavor, totals)
              print(flavor, " ".join(f"{key}={value}" for key, value in totals.items()))
          PY
          sha256sum "$APK" > candidate-sha256.txt
          cat candidate-sha256.txt >> provenance.txt
          cat unit-test-summary.txt >> provenance.txt

      - name: Upload verified GitHub debug candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ramblr-exact-source-github-debug-1.0.32
          path: |
            app/build/outputs/apk/github/debug/Ramblr-1.0.32-github-debug.apk
            provenance.txt
            candidate-sha256.txt
            candidate-badging.txt
            unit-test-summary.txt
          if-no-files-found: error
