name: R8 Native Runtime Probe

on:
  push:
    branches: [test/r8-native-runtime]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          cache-provider: basic
      - name: Check custom instrumentation lifecycle contract
        run: python3 -m unittest tools/test_probe_instrumentation_lifecycle.py -v
      - name: Build optimized non-debuggable probe and matching tests
        run: ./gradlew assembleGithubRuntimeProbe assembleGithubRuntimeProbeAndroidTest
      - name: Require generated androidTest R8 mapping
        run: test -f app/build/outputs/mapping/githubRuntimeProbeAndroidTest/mapping.txt
      - name: Record matching probe APK identities and native hashes
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess, zipfile
          from pathlib import Path
          root = Path("app/build/outputs/apk")
          target = next(root.glob("github/runtimeProbe/*.apk"))
          test = next(root.glob("androidTest/github/runtimeProbe/*.apk"))
          tools = Path(os.environ["ANDROID_HOME"]) / "build-tools"
          latest = sorted(tools.iterdir(), key=lambda p: tuple(map(int, re.findall(r"\d+", p.name))))[-1]
          def command(*args): return subprocess.check_output(args, text=True, stderr=subprocess.STDOUT)
          def identity(apk):
              package = command(latest / "aapt2", "dump", "packagename", apk).strip()
              certs = command(latest / "apksigner", "verify", "--print-certs", apk)
              match = re.search(r"(?i)sha-?256 digest:\s*([0-9a-f:]+)", certs)
              assert match, certs
              cert = match.group(1).replace(":", "").lower()
              with apk.open("rb") as stream:
                  sha256 = hashlib.file_digest(stream, "sha256").hexdigest()
              return {"path": str(apk), "bytes": apk.stat().st_size, "sha256": sha256, "package": package, "certificateSha256": cert}
          with zipfile.ZipFile(target) as apk:
              native = {entry.filename: hashlib.sha256(apk.read(entry)).hexdigest() for entry in apk.infolist() if entry.filename.startswith("lib/arm64-v8a/") and entry.filename.endswith(".so")}
          result = {"target": identity(target), "test": identity(test), "signersMatch": identity(target)["certificateSha256"] == identity(test)["certificateSha256"], "targetNonDebuggable": "runtimeProbe", "nativeLibrarySha256": native, "mapping": {"target": "app/build/outputs/mapping/github/runtimeProbe/mapping.txt", "androidTest": "app/build/outputs/mapping/githubRuntimeProbeAndroidTest/mapping.txt"}}
          assert result["target"]["package"] == "com.trevornk.ramblr.r8probe8", result
          assert result["test"]["package"] == "com.trevornk.ramblr.r8probe8.test", result
          assert result["signersMatch"], result
          Path("app/build/probe-artifact-identity.json").write_text(json.dumps(result, indent=2, sort_keys=True))
          print(json.dumps(result, sort_keys=True))
          PY
      - name: Upload probe artifacts and R8 mappings
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: r8-native-runtime-probe
          path: |
            app/build/outputs/apk/github/runtimeProbe/*.apk
            app/build/outputs/apk/androidTest/github/runtimeProbe/*.apk
            app/build/outputs/mapping/github/runtimeProbe/*
            app/build/outputs/mapping/githubRuntimeProbeAndroidTest/*
            app/build/probe-artifact-identity.json
          if-no-files-found: error
