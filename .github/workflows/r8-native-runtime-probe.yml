name: R8 Native Runtime Probe

on:
  push:
    branches: [test/r8-native-runtime]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          cache-provider: basic
      - name: Build optimized non-debuggable probe and matching tests
        run: ./gradlew assembleGithubRuntimeProbe assembleGithubRuntimeProbeAndroidTest
      - name: Upload probe artifacts and R8 mapping
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: r8-native-runtime-probe
          path: |
            app/build/outputs/apk/github/runtimeProbe/*.apk
            app/build/outputs/apk/androidTest/github/runtimeProbe/*.apk
            app/build/outputs/mapping/github/runtimeProbe/*
          if-no-files-found: error
