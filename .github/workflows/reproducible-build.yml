name: Reproducible release build

# Builds the UNSIGNED release APK on Linux so it can be independently byte-diffed against
# F-Droid's own Linux buildserver rebuild (fdroid/fdroiddata!42401, reviewer linsui). The
# release signing key never touches this workflow or any GitHub secret -- see
# app/build.gradle.kts's keystore.properties fallback: with no keystore.properties present,
# the release variant simply falls back to debug signing, so `assembleRelease` here produces
# a buildable-but-unsigned-for-distribution artifact. Signing happens locally afterward,
# offline, straight from the 1Password-held key, then the signed APK is what actually gets
# uploaded to a GitHub Release matching the `Binaries:` URL template in fdroiddata.
#
# Tag-triggered rather than push-triggered like release.yml/ci.yml: this only needs to run
# once per real version bump (matching the `Binaries:` field's specific versionName/versionCode
# pin), not on every commit to main.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      ref:
        description: >-
          Optional commit SHA/tag to check out instead of the triggering ref. Needed to rebuild
          a specific already-tagged release's reference APK (e.g. for F-Droid Binaries: URL
          verification) after this workflow file itself was added on a later commit --
          workflow_dispatch requires the workflow file to exist at the dispatched ref, but the
          embedded version-control-info in the built APK must match the exact metadata-pinned
          commit, not just "whatever main/tag currently resolves the workflow file from".
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build-unsigned-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Actions pinned to full commit SHAs, not mutable tags (L-3); see ci.yml/release.yml.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Empty string (unset input, or a plain `push` trigger) falls back to the actions/
          # checkout default (the triggering ref) -- only override when explicitly given.
          ref: ${{ inputs.ref || '' }}
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          # The action's own default is `packages: 'tools platform-tools'`, and the `tools`
          # package is obsolete -- it no longer exists in the SDK repository, so sdkmanager
          # exits 1 with "Failed to find package 'tools'" and the step fails. This is not a
          # flake: it reproduced identically on a re-run. Request only platform-tools.
          packages: platform-tools

      - name: Set up Gradle
        # cache-provider: basic pins this to the MIT-licensed caching implementation; v6's
        # default "enhanced" provider loads the proprietary `gradle-actions-caching` library.
        # See the fuller note in ci.yml. Do not drop this input.
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-provider: basic

      - name: Assemble unsigned release APKs
        # Builds BOTH flavors' release variants (github + storefront). Storefront is the one
        # F-Droid consumes; github is kept for the self-updating sideload channel.
        run: ./gradlew assembleRelease

      - name: Upload unsigned release APKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: app-release-unsigned
          # BOTH flavors are uploaded (fdroid/fdroiddata!42401 reviewer finding 1). This step
          # previously globbed only .../apk/github/release/, which is why no storefront
          # reference binary had ever been published even though `assembleRelease` above was
          # already building one: F-Droid's recipe was therefore pinned to the `github` flavor,
          # the only flavor that compiles the self-updater in (SelfUpdateCheckWorker polling
          # api.github.com every ~6h, notify defaulting on, PackageInstaller-based install).
          # That violates F-Droid's inclusion policy on apps updating themselves outside
          # F-Droid, and contradicts this repo's own README, which designates `storefront` as
          # the F-Droid/Play build with that code physically absent from the source set.
          #
          # Publishing the storefront APK is the *prerequisite* for flipping the fdroiddata
          # recipe to `gradle: [storefront]` and repointing `Binaries:` at
          # Ramblr-<version>-storefront-release.apk -- the metadata must not be switched before
          # a matching signed reference binary exists at that URL, or F-Droid's binary
          # comparison has nothing to compare against.
          path: app/build/outputs/apk/*/release/Ramblr-*-release.apk
          if-no-files-found: error
